<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工位机报价工作台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/station.js" defer></script>
</head>
<body class="station-page">
  <header class="site-header station-topbar">
    <a href="/" class="brand">吸塑报价工作台</a>
    <nav class="workbench-nav station-nav" aria-label="报价工作台">
      <a href="/">普通吸塑报价</a>
      <a href="/station" aria-current="page">工位机报价</a>
    </nav>
    <button type="button" id="station-logout" class="text-button">退出</button>
  </header>
  <main class="station-main">
    <div class="station-title">
      <h1>工位机报价</h1>
      <p>适用普通未植绒片材</p>
    </div>
    <div class="station-workbench">
      <form id="station-form" novalidate>
        <section class="station-card" aria-labelledby="station-material-title">
          <h2 id="station-material-title">规格与用料</h2>
          <fieldset class="station-methods">
            <legend class="sr-only">选用料方式</legend>
            <label>
              <input type="radio" name="sourceMode" value="weight" checked>
              <span>按克重<small>克重和成品率已知</small></span>
            </label>
            <label>
              <input type="radio" name="sourceMode" value="actual">
              <span>按实际拉片<small>已有拉片尺寸</small></span>
            </label>
            <label>
              <input type="radio" name="sourceMode" value="layout">
              <span>按单件排模<small>由产品推算拉片</small></span>
            </label>
          </fieldset>
          <section class="station-layout-controls" data-group="layout" hidden>
            <div class="station-grid" id="station-layout-size"></div>
            <div class="station-grid station-layout-options" id="station-layout-options">
              <label class="field">排法<select name="layoutMethod"><option value="auto">自动排模</option><option value="manual">指定行列</option></select></label>
              <label class="field">产品方向<select name="layoutOrientation"><option value="fixed">按填写方向</option><option value="compare">比较旋转 90°</option></select></label>
              <label class="field station-layout-profile" data-group="layoutAuto">版型<select name="layoutSize"><option value="regular">常规版（长 ≤ 600 mm）</option><option value="large">大版（按设备上限）</option><option value="custom">自定长度上限</option></select></label>
            </div>
            <details class="station-disclosure">
              <summary>设备长宽上限</summary>
              <div class="station-grid">
                <label class="field">最大模具长（mm）<input name="maxMoldLengthMm" type="number" min="1" max="860" step="any" value="860" required></label>
                <label class="field">最大模具宽（mm）<input name="maxMoldWidthMm" type="number" min="1" max="760" step="any" value="760" required></label>
              </div>
            </details>
            <div class="station-layout-action">
              <button id="station-preview-layout" class="secondary-button" type="button">仅计算排模与拉片</button>
              <p id="station-layout-status" role="status" hidden></p>
            </div>
          </section>
          <section id="station-layout-result" class="station-layout-result" aria-label="排模与拉片结果" aria-live="polite" hidden></section>
          <div class="station-grid station-triple" id="station-production">
            <label class="field station-wide" data-group="sheet" hidden>成品率依据<select name="yieldBasis">
              <option value="measured">实测单件克重</option><option value="projection">产品裁切投影面积</option><option value="provided">直接填写成品率</option>
            </select></label>
          </div>
        </section>
        <section class="station-card" aria-labelledby="station-operation-title">
          <h2 id="station-operation-title">产能</h2>
          <div class="station-grid station-triple" id="station-capacity"></div>
        </section>
        <section class="station-card" aria-labelledby="station-costs-title">
          <h2 id="station-costs-title">费用与税点</h2>
          <div class="station-grid station-triple" id="station-costs">
            <label class="field">班费计法<select name="shiftBilling"><option value="prorated">按工时分摊</option><option value="whole">按整班计</option></select></label>
          </div>
          <details class="station-disclosure"><summary>装运、纸箱、模具与加价</summary><div class="station-grid station-triple" id="station-extra"></div></details>
        </section>
        <div class="station-submit">
          <p id="station-form-error" role="alert" hidden></p>
          <button class="primary-button" type="submit">计算报价</button>
        </div>
      </form>
      <aside id="station-results" class="result-card station-results" aria-labelledby="station-quote-heading" tabindex="-1">
        <div class="station-price-main">
          <h2 id="station-quote-heading">整单报价</h2>
          <div class="station-price-pair">
            <div class="station-price">
              <span>未税单价</span>
              <div>¥ <strong id="station-untaxed">—</strong></div>
              <small>元 / 件</small>
            </div>
            <div class="station-price station-taxed-price">
              <span>含税单价</span>
              <div>¥ <strong id="station-taxed">—</strong></div>
              <small>元 / 件</small>
            </div>
          </div>
          <dl class="station-totals">
            <div><dt>未税总额</dt><dd id="station-untaxed-total">¥ —</dd></div>
            <div class="station-total-emphasis"><dt>含税总额</dt><dd id="station-total">¥ —</dd></div>
          </dl>
          <p id="station-message" role="status">填写资料后计算。</p>
        </div>
        <div id="station-profit" class="station-results-section" hidden>
          <h3>客户售价测算</h3>
          <div id="station-profit-result"></div>
        </div>
        <details id="station-cost-details" class="station-results-section station-disclosure" hidden>
          <summary>用料、产能与成本</summary>
          <div id="station-cost-result"></div>
        </details>
        <div class="station-results-section station-copy" id="station-copy-actions" hidden>
          <button id="station-copy-quote" type="button" class="secondary-button">复制报价</button>
          <span id="station-copy-status" role="status"></span>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
